<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1580">
<title>Rinksheets</title>
<style>
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#eef0f7; --text:#12162b; --muted:#5b6178;
  --line:#dde0ea; --accent:#0a1580; --accent-ink:#ffffff; --accent-soft:#e3e6fb;
  --win:#1f7a4a; --loss:#b3261e; --tie:#8a6d00; --live:#d92d20;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,64,.06),0 2px 8px rgba(16,24,64,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f1a; --surface:#171a2a; --surface-2:#1f2336; --text:#e9ebf5; --muted:#9aa0b8;
    --line:#2a2f47; --accent:#8e9bff; --accent-ink:#0d0f1a; --accent-soft:#232a55;
    --win:#4fc38a; --loss:#ff7b72; --tie:#e0c050; --live:#ff5a4f; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f1a; --surface:#171a2a; --surface-2:#1f2336; --text:#e9ebf5; --muted:#9aa0b8;
  --line:#2a2f47; --accent:#8e9bff; --accent-ink:#0d0f1a; --accent-soft:#232a55;
  --win:#4fc38a; --loss:#ff7b72; --tie:#e0c050; --live:#ff5a4f; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header */
.top{background:#0a1580;color:#fff;padding:18px 0 14px;padding-top:max(18px,env(safe-area-inset-top))}
.top .wrap{display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-size:20px;letter-spacing:.2px}
.top h1 .tag{font-size:14px;font-weight:500;opacity:.85;letter-spacing:0}
.top h1 .tag::before{content:'– '}
@media (max-width:520px){.top h1 .tag{display:block;font-size:13px;margin-top:1px}.top h1 .tag::before{content:none}}
.top .sub{font-size:13px;opacity:.8;margin-top:2px}
.top .grow{flex:1;min-width:0}
.iconbtn{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:#fff}
.iconbtn:hover{background:rgba(255,255,255,.2)}
.iconbtn svg{width:20px;height:20px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* controls */
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.field select,.field input{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;appearance:none;-webkit-appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.field.full{grid-column:1/-1}
.field[hidden]{display:none}
.controls.has-flight .field.team{grid-column:1/-1}
.field.team select{border-color:var(--accent);font-weight:600}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;position:sticky;top:0;z-index:5;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.tabs .count{font-weight:500;opacity:.7;font-size:12px;margin-left:4px}

/* summary strip */
.summary{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.summary .rec{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.summary .lbl{font-size:12px;color:var(--muted)}
.summary .next{margin-left:auto;text-align:right;font-size:13px;min-width:0}
.summary .next b{display:block}

/* day groups & games */
.day{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:18px 2px 8px}
.day:first-child{margin-top:4px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.game.mine{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.game.cancelled{opacity:.6}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.meta time{font-weight:600;color:var(--text)}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge.final{background:var(--surface-2);color:var(--text)}
.badge.live{background:var(--live);color:#fff}
.badge.cancel{background:transparent;border:1px solid var(--loss);color:var(--loss)}
.badge.res-W{background:var(--win);color:#fff}.badge.res-L{background:var(--loss);color:#fff}.badge.res-T{background:var(--tie);color:#fff}
.meta .host{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.trow{display:flex;align-items:center;gap:10px;padding:4px 0}
.trow img,.trow .ph{width:28px;height:28px;border-radius:6px;object-fit:contain;background:#fff;flex:none;border:1px solid var(--line)}
.trow .ph{background:var(--surface-2)}
.trow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .ha{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;flex:none}
.trow .sc{font-size:20px;font-weight:700;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.trow.me .nm{font-weight:700;color:var(--accent)}
.trow.lose .sc{color:var(--muted);font-weight:500}
.venue{font-size:13px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.venue a{color:var(--muted);text-decoration:none}
.venue a:hover{text-decoration:underline}
.venue svg{width:14px;height:14px;flex:none;margin-top:2px}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;text-decoration:none;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn:not(.primary):hover{background:var(--surface-2)}

/* standings */
.sched-h{font-size:14px;font-weight:700;margin:6px 2px 8px}
.flight{margin-bottom:10px}
.flight>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);font-weight:700;box-shadow:var(--shadow)}
.flight>summary::-webkit-details-marker{display:none}
.flight>summary::before{content:'';width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.flight[open]>summary::before{transform:rotate(45deg)}
.flight[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent;box-shadow:none}
.flight.mine>summary{border-color:var(--accent)}
.flight .fcount{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted)}
.flight>.tablewrap{border-top-left-radius:0;border-top-right-radius:0;margin-bottom:0}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;margin-bottom:16px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:right;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th.t,td.t{text-align:left;white-space:normal;min-width:150px}
td.rk{color:var(--muted);width:32px}
td.pts{font-weight:700}
tr.me td{background:var(--accent-soft)}
tr.me td.t{font-weight:700;color:var(--accent)}

/* team links, sortable stats tables, team page */
.tlink{color:inherit;text-decoration:none;cursor:pointer}
.tlink:hover{text-decoration:underline}
.trow .nm .tlink{display:block;overflow:hidden;text-overflow:ellipsis}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--text)}
th.sort[aria-sort]{color:var(--accent)}
th.sort[aria-sort]::after{content:'';display:inline-block;margin-left:4px;border:4px solid transparent;vertical-align:middle}
th.sort[aria-sort="descending"]::after{border-top-color:currentColor;margin-top:4px}
th.sort[aria-sort="ascending"]::after{border-bottom-color:currentColor;margin-top:-4px}
td.sorted{font-weight:700}
.stats td.t,.stats th.t{position:sticky;left:0;background:var(--surface);z-index:1}
.stats th.t{z-index:2}
.stats tr.me td.t{background:var(--accent-soft)}
.stats th,.stats td{padding:8px 6px}
.stats td.t,.stats th.t{min-width:130px}
.stats td.t .tm{font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg .count{font-weight:500;opacity:.7;font-size:12px;margin-left:4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.statnote{font-size:12px;color:var(--muted);margin:-4px 2px 12px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;margin:2px 0 10px}
.back svg{width:16px;height:16px}
.teamhead{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.teamhead img,.teamhead .ph{width:56px;height:56px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none}
.teamhead h2{margin:0;font-size:18px;line-height:1.25}
.teamhead .full{font-size:12px;color:var(--muted);margin-top:2px}
.teamhead .grow{flex:1;min-width:0}
.recgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.recgrid div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.recgrid b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.recgrid span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.myteam{margin-top:8px;font-size:13px;padding:6px 10px}
body.teamview .controls,body.teamview .tabs,body.teamview #summary{display:none}

/* misc */
.empty,.error{text-align:center;color:var(--muted);padding:40px 16px}
.error{color:var(--loss)}
.notice{font-size:13px;background:var(--surface-2);border-radius:10px;padding:8px 12px;margin-bottom:10px;color:var(--muted)}
.skel{height:120px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
.more{display:block;width:100%;margin:6px 0 14px;justify-content:center}
footer{font-size:12px;color:var(--muted);text-align:center;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
footer a{color:var(--muted)}
.themebtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
@media (min-width:640px){.controls{grid-template-columns:1fr 1fr 1fr 1.3fr}.field.full{grid-column:auto}.field.search{grid-column:1/-1}
  .controls.has-flight{grid-template-columns:1fr 1fr 1fr 1fr 1.3fr}.controls.has-flight .field.team{grid-column:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><ellipse cx="17" cy="20" rx="13" ry="6" fill="#fff" opacity=".95"/><ellipse cx="17" cy="16" rx="13" ry="6" fill="#fff"/><ellipse cx="17" cy="16" rx="13" ry="6" fill="none" stroke="#0a1580" stroke-width="1.5"/></svg>
    <div class="grow">
      <h1>Rinksheets <span class="tag">Scores, Gamesheets, Stats &amp; more</span></h1>
      <div class="sub" id="sub">PCAHA A</div>
    </div>
    <button class="iconbtn" id="refresh" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="controls">
    <div class="field"><label for="league">League</label><select id="league"></select></div>
    <div class="field"><label for="cat">Division</label><select id="cat"></select></div>
    <div class="field"><label for="sch">Schedule</label><select id="sch"></select></div>
    <div class="field" id="flightField" hidden><label for="flight">Flight</label><select id="flight"></select></div>
    <div class="field team"><label for="team">My team</label><select id="team"><option value="">All teams</option></select></div>
    <div class="field full search"><label for="q">Search</label><input id="q" type="search" placeholder="Team, player, arena or game #" autocomplete="off"></div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="results" aria-selected="true">Results<span class="count" id="c-results"></span></button>
    <button role="tab" data-tab="upcoming" aria-selected="false">Upcoming<span class="count" id="c-upcoming"></span></button>
    <button role="tab" data-tab="standings" aria-selected="false">Standings</button>
    <button role="tab" data-tab="stats" aria-selected="false">Stats</button>
  </div>

  <div id="summary"></div>
  <div id="notice"></div>
  <div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<footer>
  <div id="updated"></div>
  <div style="margin-top:6px">Data from the public <a id="src" href="https://page.spordle.com/pcaha-a" target="_blank" rel="noopener">PCAHA A</a> Spordle page · Game sheets from <a href="https://pdf.hisports.app" target="_blank" rel="noopener">hisports</a> · <button class="themebtn" id="theme">Theme: auto</button></div>
</footer>

<script>
(() => {
'use strict';

/* ---------- config ---------- */
const API = 'https://pub-api.play.spordle.com/api/sp';
// Public, read-only key published by page.spordle.com itself.
const API_KEY = 'f08ed9064e3cdc382e6abb305ff543d0150fb52f';
// Each league is a Spordle "office". To add another league, add an entry here.
//  - officeId: Spordle office id, if known.
//  - probeScheduleId / nameLike: used to look the office id up automatically when it isn't known.
const LEAGUES = [
  { key: 'pcaha', name: 'PCAHA A', short: 'pcaha-a', officeId: 786,
    defaultCategory: '599ab4b2-6f05-48eb-99bd-9f6b80810e12' /* U13 A */ },
  { key: 'pcehl', name: 'PCEHL', short: 'pacific-coast-elite-hockey-league', officeId: 8585,
    nameLike: ['%PACIFIC COAST ELITE%', '%Pacific Coast Elite%', '%PCEHL%'], nameMatch: /pacific coast elite|pcehl/i,
    defaultCategoryMatch: /U13/i },
  { key: 'fvw', name: 'FVW C', short: 'fraser-valley-west', officeId: 780, defaultCategoryMatch: /U13/i },
];
const SHEET_URL = id => `https://pdf.hisports.app/game/${id}`;
const GAME_URL  = id => `https://page.spordle.com/${L().short}/schedule/${id}`;
const PAGE_SIZE = 40;

/* ---------- storage (best-effort) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('pcaha:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('pcaha:' + k, JSON.stringify(v)); } catch {} }
};
// Per-league preferences (PCAHA falls back to the keys used before leagues existed).
const pref = {
  get(k, d) { const v = store.get(S.league + ':' + k, undefined); return v !== undefined ? v : (S.league === 'pcaha' ? store.get(k, d) : d); },
  set(k, v) { store.set(S.league + ':' + k, v); }
};

/* ---------- state ---------- */
const S = {
  league: LEAGUES.some(l => l.key === store.get('league', 'pcaha')) ? store.get('league', 'pcaha') : 'pcaha',
  officeId: null, season: null, categories: [], schedules: [],
  categoryId: null, scheduleId: 'all', teamId: '',
  tab: store.get('tab', 'results'),
  q: '',
  games: [], standings: {}, loadedAt: null, offline: false,
  shown: PAGE_SIZE,
  teams: new Map(),          // team id -> team
  view: null,                // { teamId } while a team page is open
  teamTab: 'results',
  teamData: null,
  leagueGames: [],
  flight: '',                // '' = all flights, otherwise "<scheduleId>:<groupId>"            // { id, games, standings } for the open team page
  statsMode: store.get('statsMode', 'players'),
  sort: {},
  stats: null, statsFor: null, statsError: null, statsLoading: false,
  stages: store.get('stages', null), // stats stages to include; null = all
};

const L = () => LEAGUES.find(l => l.key === S.league);
function loadPrefs() {
  S.categoryId = pref.get('categoryId', L().defaultCategory || null);
  S.scheduleId = pref.get('scheduleId', 'all');
  S.teamId = pref.get('teamId', '');
  S.flight = pref.get('flight', '');
}
loadPrefs();

const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};

/* ---------- api ---------- */
async function api(path, filter) {
  let url = API + path;
  if (filter) url += (path.includes('?') ? '&' : '?') + 'filter=' + encodeURIComponent(JSON.stringify(filter));
  const r = await fetch(url, { headers: { Authorization: 'API-Key ' + API_KEY } });
  if (!r.ok) throw new Error(`Spordle API returned ${r.status}`);
  return r.json();
}

/* ---------- time helpers ---------- */
const TZ = 'America/Vancouver';
const fmt = (d, o) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, ...o }).format(d);
const dayKey = d => fmt(d, { year: 'numeric', month: '2-digit', day: '2-digit' });
function dayLabel(d) {
  const now = new Date(), k = dayKey(d);
  if (k === dayKey(now)) return 'Today';
  if (k === dayKey(new Date(now.getTime() + 864e5))) return 'Tomorrow';
  if (k === dayKey(new Date(now.getTime() - 864e5))) return 'Yesterday';
  return fmt(d, { weekday: 'long', month: 'long', day: 'numeric' });
}
const timeStr = d => fmt(d, { hour: 'numeric', minute: '2-digit' }).replace(/\s?([ap])\.?m\.?/i, (_, a) => ' ' + a.toUpperCase() + 'M');
const shortDate = d => fmt(d, { weekday: 'short', month: 'short', day: 'numeric' });

/* ---------- game model ---------- */
function status(g) {
  const now = Date.now(), st = new Date(g.startTime).getTime(), en = new Date(g.endTime || g.startTime).getTime();
  if (g.status && g.status !== 'Active') return 'cancelled';
  if (g.isLive) return 'live';
  if (st > now) return 'upcoming';
  if (g.score && Object.keys(g.score).length) return 'final';
  if (en > now) return 'live';
  return 'pending';
}
const scoreOf = (g, teamId) => g.score && g.score[teamId] != null ? g.score[teamId] : null;
const teamName = t => t ? (t.shortName || t.name) : 'TBA';
function resultFor(g, teamId) {
  const me = scoreOf(g, teamId), opp = scoreOf(g, teamId === g.homeTeamId ? g.awayTeamId : g.homeTeamId);
  if (me == null || opp == null) return null;
  return me > opp ? 'W' : me < opp ? 'L' : 'T';
}

/* ---------- loading ---------- */
// Find the league's Spordle office id (cached after the first successful lookup).
async function resolveOffice(lg) {
  if (lg.officeId) return lg.officeId;
  const cached = store.get('office:' + lg.key, null);
  if (cached) return cached;
  const attempts = [];
  if (lg.probeScheduleId) attempts.push(async () => (await api(`/schedules/${lg.probeScheduleId}`)).officeId);
  for (const pat of lg.nameLike || []) attempts.push(async () => {
    const rows = await api('/offices', { where: { name: { like: pat } } });
    const named = lg.nameMatch ? rows.filter(o => lg.nameMatch.test(o.name || '')) : rows;
    const leagueRow = named.find(o => /league/i.test(o.type || '')) || named[0];
    return leagueRow && leagueRow.id;
  });
  for (const a of attempts) {
    try { const id = await a(); if (id) { store.set('office:' + lg.key, id); return id; } } catch {}
  }
  throw new Error(`Couldn’t find the ${lg.name} league on Spordle`);
}

async function boot() {
  if (!S.view && location.hash.startsWith('#team/')) {
    const m = location.hash.match(/^#team\/([^/]+)\/([^/]+)\/(\d+)$/);
    if (m && LEAGUES.some(l => l.key === m[1])) { if (m[1] !== S.league) { S.league = m[1]; loadPrefs(); } S.categoryId = m[2]; S.view = { teamId: Number(m[3]) }; }
  }
  applyTheme(store.get('theme', 'auto'));
  fillLeagues();
  S.games = []; S.standings = {}; S.categories = []; S.schedules = [];
  setBusy(true);
  try {
    const lg = L();
    S.officeId = await resolveOffice(lg);
    const seasons = await api(`/seasons?officeId=${S.officeId}`);
    S.season = (seasons.find(s => s.isCurrent) || seasons[0]).seasonId;
    const [cats, scheds] = await Promise.all([
      api(`/categories?officeId=${S.officeId}&seasonId=${S.season}`),
      api(`/schedules?officeId=${S.officeId}&seasonId=${S.season}`)
    ]);
    S.categories = cats.sort((a, b) => a.name.localeCompare(b.name, 'en', { numeric: true }));
    S.schedules = scheds.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
    if (!S.categories.some(c => c.id === S.categoryId)) {
      const pick = S.categories.find(c => c.id === lg.defaultCategory)
        || (lg.defaultCategoryMatch && S.categories.find(c => lg.defaultCategoryMatch.test(c.name)))
        || S.categories[0];
      S.categoryId = pick ? pick.id : null;
    }
    fillSelectors();
    await loadGames();
  } catch (e) {
    setBusy(false);
    if (!restoreCache()) showError(e);
  }
}

function schedulesForCategory() { return S.schedules.filter(s => s.categoryId === S.categoryId); }

async function loadGames() {
  setBusy(true);
  const scheds = schedulesForCategory();
  const withOutside = S.scheduleId === 'all' || S.scheduleId === 'outside';
  const ids = withOutside ? scheds.map(s => s.id) : [Number(S.scheduleId)];
  if (!ids.length) { S.games = []; S.standings = {}; setBusy(false); render(); return; }
  try {
    const [games, ...stand] = await Promise.all([
      api('/games', { where: { scheduleId: { inq: ids } }, include: ['homeTeam', 'awayTeam', 'surface'], order: ['startTime ASC', 'number ASC'] }),
      ...ids.map(id => api(`/schedules/${id}/teamStats`, { where: { team: { name: { neq: 'TBA' } } }, include: ['team', 'group'] }).catch(() => []))
    ]);
    const outside = withOutside ? await loadOutsideGames(games, scheds) : [];
    S.teamData = null; // team pages re-fetch too
    S.leagueGames = games; // league-schedule games, used for head-to-head tiebreakers
    S.games = (S.scheduleId === 'outside' ? outside : games.concat(outside))
      .sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
    S.standings = Object.fromEntries(ids.map((id, i) => [id, stand[i]]));
    S.loadedAt = new Date(); S.offline = false;
    store.set('cache', { key: cacheKey(), games: S.games, standings: S.standings, at: S.loadedAt.toISOString(), schedules: S.schedules, categories: S.categories, season: S.season });
  } catch (e) {
    if (!restoreCache()) { setBusy(false); showError(e); return; }
  }
  setBusy(false);
  fillTeams();
  fillFlights();
  render();
}

/**
 * Tournaments, association exhibitions and other leagues' games: every game this
 * division's teams play outside the league's own schedules, found by team.
 */
async function loadOutsideGames(games, scheds) {
  try {
    const type = {}; scheds.forEach(s => type[s.id] = s.type);
    const members = new Map();
    const collect = list => list.forEach(g => [g.homeTeam, g.awayTeam].forEach(t => {
      if (t && t.id && !/^tba$|non-district/i.test(t.name || '')) members.set(t.id, t);
    }));
    collect(games.filter(g => type[g.scheduleId] === 'League' || type[g.scheduleId] === 'Placement'));
    if (!members.size) collect(games.filter(g => type[g.scheduleId] !== 'Tournament'));
    const ids = [...members.keys()];
    if (!ids.length) return [];
    const leagueScheds = new Set(S.schedules.map(s => s.id));
    const parts = [];
    for (let i = 0; i < ids.length; i += 40) parts.push(ids.slice(i, i + 40));
    const found = new Map();
    (await Promise.all(parts.map(part => api('/games', { where: { and: [{ seasonId: S.season },
      { or: [{ homeTeamId: { inq: part } }, { awayTeamId: { inq: part } }] }] }, include: ['homeTeam', 'awayTeam', 'surface'] }))))
      .flat().forEach(g => { if (!leagueScheds.has(g.scheduleId)) found.set(g.id, g); });
    const list = [...found.values()];
    if (!list.length) return [];
    const hosts = {};
    (await api('/offices', { where: { id: { inq: [...new Set(list.map(g => g.officeId))] } } })).forEach(o => hosts[o.id] = o.name);
    list.forEach(g => { g._host = titleCase(hosts[g.officeId] || 'Other game'); });
    return list;
  } catch (e) {
    return []; // league games still show
  }
}
const titleCase = s => String(s || '').toLowerCase().replace(/(^|[\s\-'&(])([a-z])/g, (m, p, c) => p + c.toUpperCase())
  .replace(/\b(Mha|Aa|Viaha|Omaha|U\d+)\b/gi, m => m.toUpperCase());

const cacheKey = () => S.league + '|' + S.categoryId + '|' + S.scheduleId;
function restoreCache() {
  const c = store.get('cache', null);
  if (!c || (c.key !== cacheKey() && !(S.categoryId == null && c.key.startsWith(S.league + '|')))) return false;
  const [, cat, sch] = c.key.split('|');
  Object.assign(S, { categoryId: cat, scheduleId: sch, games: c.games, standings: c.standings, loadedAt: new Date(c.at), offline: true });
  if (!S.schedules.length) { S.schedules = c.schedules || []; S.categories = c.categories || []; S.season = c.season; fillSelectors(); }
  fillTeams(); fillFlights(); render();
  return true;
}

/* ---------- flights (Spordle "groups" in the standings) ---------- */
// Flights for the schedule(s) shown. A schedule with a single group (like "Pre-season") has no flights.
function flightsAvailable() {
  if (S.scheduleId === 'outside') return [];
  const scheds = schedulesForCategory().filter(s => S.scheduleId === 'all' || String(s.id) === String(S.scheduleId));
  const out = [];
  for (const s of scheds) {
    const rows = cleanRows(S.standings[s.id]);
    const groups = new Map();
    rows.forEach(r => { if (r.groupId != null && r.group) groups.set(r.groupId, r.group.name); });
    if (groups.size < 2) continue;
    [...groups].sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'en', { numeric: true })).forEach(([gid, name]) =>
      out.push({ value: `${s.id}:${gid}`, label: name, schedule: s.name, scheduleId: s.id, groupId: gid,

}

function renderSummary(games, upcoming) {
  const tid = Number($('#team').value) || null;
  const box = $('#summary');
  if (!tid) return box.replaceChildren();
  // Prefer the league's official standings record (it excludes games that don't count);
  // fall back to tallying final scores ourselves.
  let w = 0, l = 0, t = 0, pts = null;
  const rows = Object.values(S.standings).flatMap(cleanRows).filter(r => r.teamId === tid);
  const flight = rows.map(r => r.group && r.group.name).filter(Boolean).pop();
  if (rows.length) { for (const r of rows) { w += r.wins || 0; l += r.losses || 0; t += r.ties || 0; pts = (pts || 0) + (r.points || 0); } }
  else for (const g of games) { const r = status(g) === 'final' ? resultFor(g, tid) : null; if (r === 'W') w++; else if (r === 'L') l++; else if (r === 'T') t++; }
  const next = upcoming.find(g => status(g) === 'upcoming');
  const live = upcoming.find(g => status(g) === 'live');
  const n = live || next;
  const opp = n ? (n.homeTeamId === tid ? n.awayTeam : n.homeTeam) : null;
  box.replaceChildren(el('div', { class: 'summary' },
    el('div', {}, el('div', { class: 'rec' }, `${w}-${l}-${t}`), el('div', { class: 'lbl' }, [pts != null ? `W-L-T · ${pts} pts` : 'W-L-T', flight].filter(Boolean).join(' · '))),
    n ? el('div', { class: 'next' }, el('span', { class: 'lbl' }, live ? 'Playing now' : 'Next game'),
      el('b', {}, `${n.homeTeamId === tid ? 'vs' : '@'} `, teamLink(opp)),
      el('span', {}, `${shortDate(new Date(n.startTime))} · ${timeStr(new Date(n.startTime))}`)) : ''));
}

// Standings rows, cleaned: drop placeholder rows, and when a team is listed in a flight
// (Spordle "group") also drop its duplicate row with no flight.
function cleanRows(rows) {
  rows = (rows || []).filter(r => r && r.team);
  const inGroup = new Set(rows.filter(r => r.groupId != null).map(r => r.teamId));
  const seen = new Set();
  return rows.filter(r => {
    if (r.groupId == null && inGroup.has(r.teamId)) return false;
    const k = r.teamId + '|' + r.groupId;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
}
const rankOf = r => r.manualRanking ?? r.ranking ?? 999;

/**
 * PCAHA standings order (one schedule's group of teams):
 *  (a) most points, (b) most wins, (c) fewest losses, then among the teams still tied,
 *  using only the games they played against each other (head-to-head):
 *  (i) best winning percentage (ties count as half a win), (ii) best goals-for share,
 *  GF / (GF + GA), (iii) fewest goals against; then (iv) fewest goals against overall.
 * When a step splits a tie of three or more, the teams still tied start again at (i)
 * using only their own games against each other. A step is skipped if a tied team
 * hasn't played any of the others. Teams still level keep Spordle's order.
 */
function pcahaOrder(rows, games) {
  const base = (a, b) => (b.points || 0) - (a.points || 0) || (b.wins || 0) - (a.wins || 0) || (a.losses || 0) - (b.losses || 0);
  const sorted = rows.slice().sort((a, b) => base(a, b) || rankOf(a) - rankOf(b));
  const out = [];
  for (let i = 0; i < sorted.length;) {
    let j = i + 1;
    while (j < sorted.length && base(sorted[i], sorted[j]) === 0) j++;
    const tied = sorted.slice(i, j);
    if (tied.length > 1) tied.forEach(r => r._tied = true);
    out.push(...breakTie(tied, games, 0));
    i = j;
  }
  return out;
}
const round9 = v => v == null ? null : Math.round(v * 1e9) / 1e9;
const TIEBREAKS = [
  { name: 'head-to-head winning %', h2h: true, high: true, val: s => s.gp ? (s.w + s.t / 2) / s.gp : null },
  { name: 'head-to-head goals-for %', h2h: true, high: true, val: s => s.gp ? (s.gf + s.ga ? s.gf / (s.gf + s.ga) : 0.5) : null },
  { name: 'head-to-head goals against', h2h: true, high: false, val: s => s.gp ? s.ga : null },
  { name: 'goals against (all games)', h2h: false, high: false, val: (s, r) => r.goalAgainst || 0 },
];
function breakTie(group, games, start) {
  if (group.length < 2) return group;
  const ids = new Set(group.map(r => r.teamId));
  const st = new Map(group.map(r => [r.teamId, { gp: 0, w: 0, t: 0, gf: 0, ga: 0 }]));
  for (const g of games) {
    if (!ids.has(g.homeTeamId) || !ids.has(g.awayTeamId) || status(g) !== 'final') continue;
    const hs = scoreOf(g, g.homeTeamId), as = scoreOf(g, g.awayTeamId);
    if (hs == null || as == null) continue;
    for (const [me, f, a] of [[g.homeTeamId, hs, as], [g.awayTeamId, as, hs]]) {
      const s = st.get(me); s.gp++; s.gf += f; s.ga += a;
      if (f > a) s.w++; else if (f === a) s.t++;
    }
  }
  for (let c = start; c < TIEBREAKS.length; c++) {
    const tb = TIEBREAKS[c];
    const vals = group.map(r => round9(tb.val(st.get(r.teamId), r)));
    if (vals.some(v => v == null)) continue; // someone hasn't played the others: skip this step
    const distinct = [...new Set(vals)].sort((x, y) => tb.high ? y - x : x - y);
    if (distinct.length < 2) continue;
    return distinct.flatMap(v => {
      const sub = group.filter((r, k) => vals[k] === v);
      if (sub.length === 1) sub[0]._tb = tb.name; // the step that settled this team's place
      // A smaller tie starts again at (i) with only its own head-to-head games.
      return sub.length > 1 ? breakTie(sub, games, tb.h2h ? 0 : c + 1) : sub;
    });
  }
  return group;
}

// Leagues whose standings follow PCAHA's tiebreak rules (the PCEHL is part of the PCAHA).
const PCAHA_RULES = ['pcaha', 'pcehl', 'fvw'];

function standingsTable(rows, tid, scheduleId) {

/**
 * A team page always shows all of the team's games this season (league schedules,
 * tournaments and other games), whatever schedule is picked on the main screen.
 */
async function loadTeamData(id) {
  S.teamData = { id, loading: true };
  try {
    const leagueScheds = new Set(S.schedules.map(s => s.id));
    const catScheds = schedulesForCategory();
    const [games, ...stand] = await Promise.all([
      api('/games', { where: { and: [{ seasonId: S.season }, { or: [{ homeTeamId: id }, { awayTeamId: id }] }] },
        include: ['homeTeam', 'awayTeam', 'surface'] }),
      ...catScheds.map(s => S.standings[s.id] ? Promise.resolve(S.standings[s.id])
        : api(`/schedules/${s.id}/teamStats`, { where: { team: { name: { neq: 'TBA' } } }, include: ['team', 'group'] }).catch(() => []))
    ]);
    const outside = games.filter(g => !leagueScheds.has(g.scheduleId));
    if (outside.length) {
      const hosts = {};
      try {
        (await api('/offices', { where: { id: { inq: [...new Set(outside.map(g => g.officeId))] } } })).forEach(o => hosts[o.id] = o.name);
      } catch (e) { /* labels only */ }
      outside.forEach(g => { g._host = titleCase(hosts[g.officeId] || 'Other game'); });
    }
    games.sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
    if (!S.view || S.view.teamId !== id) return; // user moved on
    S.teamData = { id, games, standings: Object.fromEntries(catScheds.map((s, i) => [s.id, stand[i]])) };
  } catch (e) {
    // Offline or Spordle unavailable: fall back to the games already loaded.
    if (!S.view || S.view.teamId !== id) return;
    S.teamData = { id, games: S.games.filter(g => g.homeTeamId === id || g.awayTeamId === id), standings: S.standings, partial: true };
  }
  render();
}

const LEAGUE_STATS_NAME = { pcaha: 'PCAHA A', pcehl: 'PCEHL', fvw: 'FVW C' };

  players: [

    { label: 'GP', i: 3 }, { label: 'G', i: 4, title: 'Goals' }, { label: 'A', i: 5, title: 'Assists' },
    { label: 'PTS', i: 6, title: 'Points' }, { label: 'PIM', i: 7, title: 'Penalties in minutes' }],
  goalies: [
    { label: 'Goalie', i: 0, text: true }, { label: 'Team', i: 1, text: true, team: true },
    { label: 'GP', i: 3 }, { label: 'W', i: 4 }, { label: 'L', i: 5 }, { label: 'T', i: 6 },
    { label: 'GA', i: 7, title: 'Goals against' }, { label: 'GAA', i: 8, title: 'Goals-against average', asc: true, fixed: 2 },
    { label: 'SO', i: 9, title: 'Shutouts' }],

const STAGE_ORDER = ['Regular season', 'Placement', 'Playoffs', 'Exhibition', 'Tournament', 'Other'];
// stats.json v2 rows carry a stage: players [name, team, div, stage, GP, G, A, PTS, PIM],
// goalies [name, team, div, stage, GP, W, L, T, GA, SO]. Rows for the selected stages are added up.
function statRows(lg, mode) {
  const v2 = S.stats.version >= 2;
  const rows = lg[mode].map(r => v2 ? r : mode === 'players' ? [r[0], r[1], r[2], ''].concat(r.slice(3))
    : [r[0], r[1], r[2], ''].concat(r.slice(3, 8), [r[9]]));

}

  const seen = new Set();
  ['players', 'goalies'].forEach(m => statRows(lg, m).forEach(r => r[3] && seen.add(r[3])));
  return [...seen].sort((a, b) => (STAGE_ORDER.indexOf(a) + 99) % 99 - (STAGE_ORDER.indexOf(b) + 99) % 99 || a.localeCompare(b));
}

    if (!s) { by.set(k, r.slice(0, 3).concat(r.slice(4))); continue; }
    for (let i = 4; i < r.length; i++) s[i - 1] += r[i];

    : s.slice(0, 8).concat([s[3] ? Math.round(s[7] / s[3] * 100) / 100 : 0, s[8]])); // [..., GA, GAA, SO]
}

  const sel = S.stages ? all.filter(x => S.stages.includes(x)) : all;
  const set = list => { S.stages = list.length === all.length ? null : list; store.set('stages', S.stages); render(); };
  return el('div', { class: 'chips', role: 'group', 'aria-label': 'Game types' },
    el('button', { class: 'chip', 'aria-pressed': String(sel.length === all.length), onclick: () => set(all) }, 'All games'),
    ...all.map(x => el('button', { class: 'chip', 'aria-pressed': String(S.stages != null && sel.includes(x)), onclick: () => {

const DEFAULT_SORT = { players: { i: 6, dir: -1 }, goalies: { i: 4, dir: -1 } };

// Each league's stats are in their own file (stats/stats-<key>.json), loaded when needed.
async function loadStats() {
  const key = S.league;
  if (S.statsFor === key && (S.stats || S.statsLoading)) return;
  S.statsFor = key; S.stats = null; S.statsError = null; S.statsLoading = true;
  let data = null, error = null;
  try {
    let r = await fetch(`stats/stats-${key}.json`, { cache: 'no-cache' });
    if (r.status === 404) r = await fetch('stats/stats.json', { cache: 'no-cache' }); // before the split files exist
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (e) {
    error = location.protocol === 'file:'
      ? 'Stats only load on the published site (not when the file is opened from your computer).'
      : 'Couldn’t load stats: ' + e.message;
  }
  if (S.statsFor !== key) return; // league changed while loading

/** A sortable stats table for one division, optionally limited to one team. */
function statsBlock(mode, { division, team, search }) {
  if (S.statsFor !== S.league || !S.stats) {
    if (S.statsFor !== S.league || !S.statsError) { loadStats(); return el('div', { class: 'skel' }); }
    return el('div', { class: 'empty' }, S.statsError);
  }
  const lg = S.stats.leagues[LEAGUE_STATS_NAME[S.league]];
  const stages = lg ? stagesIn(lg) : [];
  const picked = S.stages ? stages.filter(x => S.stages.includes(x)) : stages;
  let rows = lg ? sumStages(statRows(lg, mode).filter(r => r[2] === division && (!team || r[1] === team)
    && (!r[3] || !S.stages || picked.includes(r[3]))), mode) : [];
  const flight = team ? null : currentFlight();
  if (flight) {
    const names = new Set(flight.teams.map(id => S.teams.get(id)).filter(Boolean).map(teamName));
    rows = rows.filter(r => names.has(r[1]));
  }
  const q = (search || '').trim().toLowerCase();
  if (q) rows = rows.filter(r => String(r[0]).toLowerCase().includes(q) || String(r[1]).toLowerCase().includes(q));
  const cols = STAT_COLS[mode].filter(c => !c.team); // team is shown under the name to keep the table narrow
  const sortKey = mode + (team ? ':team' : ''); // the team page keeps its own sort
  const sort = S.sort[sortKey] || DEFAULT_SORT[mode];
  const cmpVal = (a, b, i, dir) => (typeof a[i] === 'string' ? String(a[i]).localeCompare(String(b[i])) : a[i] - b[i]) * dir;
  rows = rows.slice().sort((a, b) => cmpVal(a, b, sort.i, sort.dir)
    || TIEBREAK[mode].reduce((x, i) => x || cmpVal(a, b, i, i === 8 ? 1 : -1), 0) || String(a[0]).localeCompare(String(b[0])));

  const myTeam = S.teamId ? S.teams.get(Number(S.teamId)) : null;
  const myName = myTeam ? teamName(myTeam) : null;

    render();

  const note = el('div', { class: 'statnote' }, rows.length
    ? `${rows.length} ${what}${team ? '' : ' · ' + division}${flight ? ` · ${flight.label} (${flight.schedule}) teams` : ''} · ${picked.length === stages.length ? 'all games' : picked.join(', ')} · tap a heading to sort · updated ${shortDate(new Date(S.stats.updated))}, ${timeStr(new Date(S.stats.updated))}`
    : `No ${what} stats${team ? ' for this team' : ' for ' + division} ${picked.length === stages.length ? 'yet' : 'in these games'}.`);
  const chips = lg ? stageChips(lg) : '';
  if (!rows.length) { const f = document.createDocumentFragment(); f.append(chips, note); return f; }

  const table = el('table', { class: 'stats' },
    el('thead', {}, el('tr', {}, el('th', {}, '#'), ...cols.map(c => el('th', {
      class: 'sort' + (c.i === 0 ? ' t' : c.team ? ' team' : ''), title: c.title || null,
      'aria-sort': sort.i === c.i ? (sort.dir > 0 ? 'ascending' : 'descending') : null,
      onclick: () => setSort(c) }, c.label)))),
    el('tbody', {}, ...rows.map((r, k) => el('tr', { class: !team && myName && r[1] === myName ? 'me' : '' },
      el('td', { class: 'rk' }, String(k + 1)),
      ...cols.map(c => {
        const cls = [c.i === 0 ? 't' : c.team ? 'team' : '', sort.i === c.i && !c.text ? 'sorted' : ''].filter(Boolean).join(' ');
        const v = r[c.i];
        if (c.i === 0 && !team) {

        }

function applyTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  $('#theme').textContent = 'Theme: ' + t;
}
$('#theme').addEventListener('click', () => { const order = ['auto', 'light', 'dark']; const t = order[(order.indexOf(store.get('theme', 'auto')) + 1) % 3]; store.set('theme', t); applyTheme(t); });

// refresh when returning to the tab after a while (e.g. between periods)
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.loadedAt && Date.now() - S.loadedAt > 5 * 60e3) loadGames(); });

boot();
})();
</script>
