name: Update hockey stats

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: hockey-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download new games from Spordle
        run: node stats/update.mjs
      - name: Save the data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add stats/data.json stats/stats.json
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Update hockey stats data"
            git push
          fi
